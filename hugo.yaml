baseURL: https://alexeyevlampiev.github.io/
languageCode: en-us
title: Alexey Evlampiev
theme: PaperMod

pagination:
  pagerSize: 10

buildFuture: true
enableGitInfo: true

frontmatter:
  lastmod:
    - :git
    - lastmod
    - date
    - publishDate

taxonomies:
  tag: tags
  series: series

params:
  author: "Alexey Evlampiev"
  description: "Essays and technical writing by Alexey Evlampiev on data architecture, PostgreSQL, deployment engineering, and the systems that AI agents act in."
  keywords: ["PostgreSQL", "Data Architecture", "Database Architecture", "Software Architecture", "AI Agents", "Serverless", "Databricks", "DevOps"]
  env: production
  defaultTheme: auto
  mainSections: ["posts"]
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Eyebrow: "Systems · Data · AI"
    Title: "Architecture for systems that have to remember correctly."
    Content: >-
      I'm Alexey Evlampiev, a Data Platform Architect in Eindhoven. I write
      field notes and essays about PostgreSQL, data platforms, and putting
      AI agents inside deterministic system boundaries.
    PrimaryAction:
      label: "Explore the essays"
      url: "/posts/"
    SecondaryAction:
      label: "About my work"
      url: "/about/"

  socialIcons:
    - name: github
      url: "https://github.com/AlexeyEvlampiev"
    - name: linkedin
      url: "https://www.linkedin.com/in/alexey-evlampiev-09572921/"
    - name: rss
      url: "/index.xml"

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  schema:
    publisherType: Person
    authorUrl: "https://alexeyevlampiev.github.io/about/"
    sameAs:
      - "https://github.com/AlexeyEvlampiev"
      - "https://www.linkedin.com/in/alexey-evlampiev-09572921/"

  cover:
    hiddenInList: false
    hiddenInSingle: true
    responsiveImages: true

outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - LLMS

menu:
  main:
    - identifier: posts
      name: Articles
      url: /posts/
      weight: 10
    - identifier: tags
      name: Topics
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
